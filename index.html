<!doctype html>
<html lang="es" data-theme="dark" data-cloud-boot="loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101117">
  <script>try{const t=localStorage.getItem("mi-dinero-theme");if(t==="light"){document.documentElement.dataset.theme="light";document.documentElement.style.colorScheme="light";document.querySelector('meta[name="theme-color"]').content="#f4f5f8"}}catch{}</script>
  <title>Mi Dinero</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260731-38">
</head>
<body>
  <div class="cloud-gate" id="cloudGate" role="status" aria-live="polite">
    <div class="cloud-gate-card">
      <span class="cloud-gate-mark" aria-hidden="true">$</span>
      <p class="eyebrow">MI DINERO</p>
      <h1 id="cloudGateTitle">Cargando tu información</h1>
      <p id="cloudGateStatus">Consultando la última versión guardada en Google Sheets…</p>
      <button type="button" class="button hidden" id="cloudGateConnect">Continuar con Google</button>
    </div>
  </div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">$</span><span>Mi Dinero</span></div>
      <nav id="nav">
        <button class="nav-item active" data-page="resumen"><span>⌂</span>Resumen</button>
        <button class="nav-item" data-page="transacciones"><span>↕</span>Transacciones</button>
        <button class="nav-item" data-page="presupuestos"><span>◎</span>Presupuestos</button>
        <button class="nav-item" data-page="transferencias"><span>⇄</span>Transferencias</button>
        <button class="nav-item" data-page="prestamos"><span>◇</span>Préstamos</button>
        <button class="nav-item" data-page="recurrentes"><span>↻</span>Recurrentes</button>
        <button class="nav-item" data-page="configuracion"><span>⚙</span>Configuración</button>
      </nav>
      <div class="sidebar-footer">
        <div class="avatar">CM</div>
        <div><strong>Carlos Miguez</strong><small>Administrador</small></div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="Abrir menú">☰</button>
        <div>
          <p class="eyebrow">FINANZAS PERSONALES</p>
          <h1 id="pageTitle">Resumen</h1>
        </div>
        <div class="top-actions">
          <div class="live-sync-status" id="liveSyncStatus" data-tone="">
            <span aria-hidden="true"></span><span class="live-sync-copy">Conectando…</span>
          </div>
          <div id="globalPeriodSlot"></div>
          <div class="header-control country-control">
            <span class="header-control-label">País</span>
            <div class="country-switch" id="countrySwitch">
            <button data-country="CN" class="active" aria-label="Ver finanzas de China">
              <span class="country-flag flag-cn" aria-hidden="true">
                <svg viewBox="0 0 32 32" role="img">
                  <rect width="32" height="32" fill="#DE2910"/>
                  <path fill="#FFDE00" d="M8 4.4l1.2 3.5h3.7l-3 2.2 1.1 3.5-3-2.1-3 2.1 1.1-3.5-3-2.2h3.7z"/>
                  <circle cx="15" cy="5.5" r="1.05" fill="#FFDE00"/><circle cx="18" cy="8.5" r="1.05" fill="#FFDE00"/>
                  <circle cx="18" cy="12.5" r="1.05" fill="#FFDE00"/><circle cx="15" cy="15.5" r="1.05" fill="#FFDE00"/>
                </svg>
              </span>
              <span class="country-name">China</span>
            </button>
            <button data-country="CO" aria-label="Ver finanzas de Colombia">
              <span class="country-flag flag-co" aria-hidden="true">
                <svg viewBox="0 0 32 32" role="img">
                  <rect width="32" height="16" fill="#FCD116"/>
                  <rect y="16" width="32" height="8" fill="#003893"/>
                  <rect y="24" width="32" height="8" fill="#CE1126"/>
                </svg>
              </span>
              <span class="country-name">Colombia</span>
            </button>
            </div>
          </div>
          <button class="icon-button" id="refreshButton" title="Actualizar">↻</button>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modal">
    <div class="modal-card">
      <div class="modal-head"><div><p class="eyebrow" id="modalEyebrow">NUEVO</p><h2 id="modalTitle">Registro</h2></div><button class="icon-button" data-close>×</button></div>
      <form id="recordForm"></form>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="confirmModal">
    <div class="confirm-card">
      <div class="danger-icon">!</div>
      <h2>Eliminar registro</h2>
      <p id="confirmText">Esta acción no se puede deshacer.</p>
      <div class="form-actions"><button class="button ghost" data-cancel>Cancelar</button><button class="button danger" id="confirmDelete">Eliminar</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="initial-data.js"></script>
  <script src="cloud-config.js"></script>
  <script src="app.js?v=20260731-53"></script>
  <script src="cloud-sync.js?v=20260731-5"></script>
</body>
</html>
