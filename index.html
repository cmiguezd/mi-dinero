<!doctype html>
<html lang="es" data-theme="dark" data-cloud-boot="loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101117">
  <script>try{const t=localStorage.getItem("mi-dinero-theme");if(t==="light"){document.documentElement.dataset.theme="light";document.documentElement.style.colorScheme="light";document.querySelector('meta[name="theme-color"]').content="#f4f5f8"}}catch{}</script>
  <title>Mi Dinero</title>
  <meta name="application-name" content="Mi Dinero">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Dinero">
  <meta name="msapplication-TileColor" content="#101117">
  <meta name="msapplication-config" content="browserconfig.xml?v=20260803-2">
  <link rel="manifest" href="manifest.webmanifest?v=20260803-2">
  <link rel="icon" href="favicon.svg?v=20260803-2" type="image/svg+xml">
  <link rel="icon" href="icons/icon-48.png?v=20260803-2" type="image/png" sizes="48x48">
  <link rel="icon" href="icons/icon-32.png?v=20260803-2" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/icon-16.png?v=20260803-2" type="image/png" sizes="16x16">
  <link rel="shortcut icon" href="favicon.ico?v=20260803-2" type="image/x-icon">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20260803-2">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png?v=20260803-2">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png?v=20260803-2">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=20260803-2">
  <link rel="mask-icon" href="safari-pinned-tab.svg?v=20260803-2" color="#f3c624">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css?v=20260806-53">
</head>
<body>
  <div class="cloud-gate" id="cloudGate" role="status" aria-live="polite">
    <div class="cloud-gate-card">
      <span class="cloud-gate-mark" aria-hidden="true">$</span>
      <p class="eyebrow">MI DINERO</p>
      <h1 id="cloudGateTitle">Cargando tu información</h1>
      <p id="cloudGateStatus">Consultando la última versión guardada en Google Sheets…</p>
      <button type="button" class="button hidden" id="cloudGateConnect">Continuar con Google</button>
    </div>
  </div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">$</span><span class="brand-name">Mi Dinero</span></div>
      <nav id="nav">
        <button class="nav-item active" data-page="resumen"><span class="nav-icon"><i class="bi bi-house-door" aria-hidden="true"></i></span><span class="nav-label">Resumen</span></button>
        <button class="nav-item" data-page="cuentas"><span class="nav-icon"><i class="bi bi-wallet2" aria-hidden="true"></i></span><span class="nav-label">Cuentas</span></button>
        <button class="nav-item" data-page="transacciones"><span class="nav-icon"><i class="bi bi-arrow-down-up" aria-hidden="true"></i></span><span class="nav-label">Transacciones</span></button>
        <button class="nav-item" data-page="presupuestos"><span class="nav-icon"><i class="bi bi-pie-chart" aria-hidden="true"></i></span><span class="nav-label">Presupuestos</span></button>
        <button class="nav-item" data-page="transferencias"><span class="nav-icon"><i class="bi bi-arrow-left-right" aria-hidden="true"></i></span><span class="nav-label">Transferencias</span></button>
        <button class="nav-item" data-page="prestamos"><span class="nav-icon"><i class="bi bi-cash-coin" aria-hidden="true"></i></span><span class="nav-label">Préstamos</span></button>
        <button class="nav-item" data-page="recurrentes"><span class="nav-icon"><i class="bi bi-arrow-repeat" aria-hidden="true"></i></span><span class="nav-label">Recurrentes</span></button>
        <button class="nav-item" data-page="configuracion"><span class="nav-icon"><i class="bi bi-gear" aria-hidden="true"></i></span><span class="nav-label">Configuración</span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="avatar">CM</div>
        <div><strong>Carlos Miguez</strong><small>Administrador</small></div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="Abrir menú" aria-expanded="false"><i class="bi bi-list" aria-hidden="true"></i></button>
        <div>
          <p class="eyebrow">FINANZAS PERSONALES</p>
          <h1 id="pageTitle">Resumen</h1>
        </div>
        <div class="top-actions">
          <div class="live-sync-status" id="liveSyncStatus" data-tone="">
            <span aria-hidden="true"></span><span class="live-sync-copy">Conectando…</span>
          </div>
          <div id="globalPeriodSlot"></div>
          <div class="header-control country-control">
            <span class="header-control-label">País</span>
            <div class="country-switch" id="countrySwitch">
            <button data-country="CN" class="active" aria-label="Ver finanzas de China">
              <span class="country-flag flag-cn" aria-hidden="true">
                <svg viewBox="0 0 32 32" role="img">
                  <rect width="32" height="32" fill="#DE2910"/>
                  <path fill="#FFDE00" d="M8 4.4l1.2 3.5h3.7l-3 2.2 1.1 3.5-3-2.1-3 2.1 1.1-3.5-3-2.2h3.7z"/>
                  <circle cx="15" cy="5.5" r="1.05" fill="#FFDE00"/><circle cx="18" cy="8.5" r="1.05" fill="#FFDE00"/>
                  <circle cx="18" cy="12.5" r="1.05" fill="#FFDE00"/><circle cx="15" cy="15.5" r="1.05" fill="#FFDE00"/>
                </svg>
              </span>
              <span class="country-name">China</span>
            </button>
            <button data-country="CO" aria-label="Ver finanzas de Colombia">
              <span class="country-flag flag-co" aria-hidden="true">
                <svg viewBox="0 0 32 32" role="img">
                  <rect width="32" height="16" fill="#FCD116"/>
                  <rect y="16" width="32" height="8" fill="#003893"/>
                  <rect y="24" width="32" height="8" fill="#CE1126"/>
                </svg>
              </span>
              <span class="country-name">Colombia</span>
            </button>
            </div>
          </div>
          <button class="icon-button" id="refreshButton" title="Actualizar" aria-label="Actualizar"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i></button>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Navegación principal">
    <button type="button" class="mobile-nav-item active" data-mobile-page="resumen">
      <i class="bi bi-house-door" aria-hidden="true"></i><span>Resumen</span>
    </button>
    <button type="button" class="mobile-nav-item" data-mobile-page="transacciones">
      <i class="bi bi-arrow-down-up" aria-hidden="true"></i><span>Movimientos</span>
    </button>
    <button type="button" class="mobile-nav-item" data-mobile-page="presupuestos">
      <i class="bi bi-pie-chart" aria-hidden="true"></i><span>Presupuestos</span>
    </button>
    <button type="button" class="mobile-nav-item" data-mobile-page="recurrentes">
      <i class="bi bi-arrow-repeat" aria-hidden="true"></i><span>Recurrentes</span>
    </button>
    <button type="button" class="mobile-nav-item" id="mobileMoreButton" aria-expanded="false" aria-controls="mobileMoreMenu" aria-haspopup="dialog">
      <i class="bi bi-grid" aria-hidden="true"></i><span>Más</span>
    </button>
  </nav>

  <button type="button" class="button mobile-context-action hidden" id="mobileContextAction">
    <i class="bi bi-plus-lg" aria-hidden="true"></i><span></span>
  </button>

  <div class="mobile-more-backdrop hidden" id="mobileMoreBackdrop">
    <section class="mobile-more-menu" id="mobileMoreMenu" role="dialog" aria-modal="true" aria-labelledby="mobileMoreTitle">
      <div class="mobile-more-head">
        <div><p class="eyebrow">NAVEGACIÓN</p><h2 id="mobileMoreTitle">Más opciones</h2></div>
        <button type="button" class="icon-button" id="closeMobileMore" aria-label="Cerrar"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
      </div>
      <div class="mobile-more-links">
        <button type="button" data-mobile-page="cuentas"><i class="bi bi-wallet2" aria-hidden="true"></i><span><strong>Control de cuentas</strong><small>Saldos reales y conciliación</small></span><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
        <button type="button" data-mobile-page="transferencias"><i class="bi bi-arrow-left-right" aria-hidden="true"></i><span><strong>Transferencias</strong><small>Movimientos entre países</small></span><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
        <button type="button" data-mobile-page="prestamos"><i class="bi bi-cash-coin" aria-hidden="true"></i><span><strong>Préstamos</strong><small>Deudas y cuentas por cobrar</small></span><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
        <button type="button" data-mobile-page="configuracion"><i class="bi bi-gear" aria-hidden="true"></i><span><strong>Configuración</strong><small>Apariencia, categorías y sincronización</small></span><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop hidden" id="modal">
    <div class="modal-card">
      <div class="modal-head"><div><p class="eyebrow" id="modalEyebrow">NUEVO</p><h2 id="modalTitle">Registro</h2></div><button class="icon-button" data-close aria-label="Cerrar"><i class="bi bi-x-lg" aria-hidden="true"></i></button></div>
      <form id="recordForm"></form>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="confirmModal">
    <div class="confirm-card">
      <div class="danger-icon"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i></div>
      <h2>Eliminar registro</h2>
      <p id="confirmText">Esta acción no se puede deshacer.</p>
      <div class="form-actions"><button class="button ghost" data-cancel>Cancelar</button><button class="button danger" id="confirmDelete">Eliminar</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="initial-data.js"></script>
  <script src="cloud-config.js"></script>
  <script src="app.js?v=20260806-61"></script>
  <script src="cloud-sync.js?v=20260731-5"></script>
</body>
</html>
